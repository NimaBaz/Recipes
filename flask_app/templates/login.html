<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='style.css') }}">
    <title>index</title>
</head>

<body>
    <div class="container">

        <div class="row">

            <div class="col">
                <h1 class="header1">Welcome to Better Choice</h1>
                <h2 class="header1">Track harmful chemicals and make informed health choices</h2>
                <h3 class="header3">Register</h3>

                <form action="/register" method="post">

                    <div class="form-group">
                        <label class="info">First Name</label>
                        <input type="text" class="form-control" placeholder="first name" name="first_name"> 
                    </div>

                    <div class="form-group">
                        <label class="info">Last Name</label>
                        <input type="text" class="form-control" placeholder="last name" name="last_name"> 
                    </div>

                    <div class="form-group">
                        <label class="info">Email</label>
                        <input type="text" class="form-control" placeholder="email" name="email"> 
                    </div>

                    <div class="form-group">
                        <label class="info">Password</label>
                        <input type="password" class="form-control" placeholder="Password" value="Password123" name="password">
                    </div>

                    <div class="form-group">
                        <label class="info">Confirm Password</label>
                        <input type="password" class="form-control" placeholder="Password" value="Password123" name="confirm-password">
                    </div>

                    <button type="submit" class="btn2">Submit</button>
                
                </form>

            </div>

            <div class="col">
                <h3 class="header4">Login</h3>

                <form action="/login" method="post">

                    <div class="form-group">
                        <label class="info">Email</label>
                        <input type="text" class="form-control" placeholder="email" name="email"> 
                    </div>

                    <div class="form-group">
                        <label class="info">Password</label>
                        <input type="password" class="form-control" placeholder="Password" value="Password123" name="password">
                    </div>

                    <button type="submit" class="btn2">Submit</button>
                
                </form>

            </div>

        </div>

    </div>

</body>
</html>
